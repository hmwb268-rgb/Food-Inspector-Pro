<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b52"><title>Food Inspector Pro | مفتش الأغذية الذكي</title>
<style>
:root{--navy:#123b52;--green:#167d68;--mint:#e7f5ef;--bg:#f3f7f8;--ink:#18313d;--muted:#6b7e87;--line:#dce6e9;--white:#fff;--gold:#e4b85b;--red:#b84040}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font-weight:700}button.secondary{background:#eaf0f2;color:var(--navy)}button.danger{background:#fff0f0;color:var(--red)}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px;border-bottom:1px solid #ffffff25}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#40b89b,#e2c16e);display:grid;place-items:center;color:#123b52;font-weight:900;font-size:22px}.brand h2{font-size:17px;margin:0 0 5px}.brand small{color:#bcd1d8}.nav{display:grid;gap:7px;margin-top:22px}.nav button{display:flex;align-items:center;gap:11px;text-align:right;background:transparent;color:#d6e5e9;font-weight:500}.nav button.active,.nav button:hover{background:#ffffff17;color:white}.nav .ico{width:25px;text-align:center;font-size:18px}.side-note{position:absolute;bottom:22px;right:18px;left:18px;color:#bcd1d8;font-size:12px;line-height:1.8}.main{min-width:0}.top{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.top h1{font-size:22px;margin:0}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}.badge{background:var(--mint);color:var(--green);padding:8px 11px;border-radius:20px;font-size:12px;font-weight:bold}.content{padding:25px;max-width:1500px;margin:auto}.welcome{background:linear-gradient(115deg,#123b52,#176f67);color:white;padding:25px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.welcome h2{margin:0 0 9px;font-size:23px}.welcome p{margin:0;color:#d5e8e7;line-height:1.7}.welcome .welcome-icon{font-size:58px;opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.stat .label{font-size:13px;color:var(--muted)}.stat .num{font-size:29px;font-weight:800;margin:12px 0 5px;color:var(--navy)}.stat .foot{font-size:12px;color:var(--green)}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel h3{font-size:17px;margin:0 0 16px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f1f8f6;color:var(--navy);border:1px solid #d9ece6;text-align:right;min-height:74px}.quick button span{display:block;font-size:21px;margin-bottom:7px}.empty{padding:22px;text-align:center;color:var(--muted);background:#f8fafb;border-radius:10px}.rowitem{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.rowitem:last-child{border:0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef5f7;color:#45636e;font-size:11px;white-space:nowrap}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.pagehead h2{margin:0;font-size:22px}.pagehead p{color:var(--muted);font-size:13px;margin:7px 0 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tools input{flex:1;min-width:180px}.field, input, select, textarea{width:100%;border:1px solid #d6e1e5;border-radius:9px;padding:11px 12px;background:white;color:var(--ink);outline-color:#70b6a5}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.formgrid label{font-size:13px;color:#506670;display:grid;gap:7px}.formgrid .wide{grid-column:1/-1}textarea{min-height:85px;resize:vertical}.formactions{display:flex;gap:9px;margin-top:17px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:right;padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f5f9fa;color:#5e737d;font-weight:700}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;font-size:12px}.notice{font-size:12px;color:var(--muted);line-height:1.8;margin-top:14px}.reportbox{white-space:pre-wrap;line-height:2;background:#f8fafb;border:1px solid var(--line);padding:16px;border-radius:12px;margin-top:15px}.toast{position:fixed;bottom:20px;left:20px;background:#173f4c;color:white;padding:13px 18px;border-radius:12px;box-shadow:0 8px 30px #0002;display:none;z-index:20}.modalback{position:fixed;inset:0;background:#102b35a6;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:white;border-radius:16px;padding:22px;width:min(720px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0}.close{background:#eef2f4;color:#334e59;padding:7px 11px}.mobilehead{display:none}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:static;padding:12px 14px}.brand{padding:0 4px 10px;border:0}.nav{display:flex;overflow:auto;margin-top:8px;gap:5px}.nav button{white-space:nowrap;padding:10px}.nav .ico{width:auto}.side-note{display:none}.top{height:auto;padding:16px 18px}.content{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.welcome{padding:20px}.welcome h2{font-size:20px}.welcome .welcome-icon{font-size:38px}}@media(max-width:520px){.brand h2{font-size:15px}.top h1{font-size:18px}.badge{font-size:10px}.stats{gap:9px}.stat{padding:14px}.stat .num{font-size:25px}.quick{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.welcome .welcome-icon{display:none}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="logo">2F</div><div><h2>مفتش الأغذية الذكي</h2><small>Food Inspector Pro</small></div></div><nav class="nav" id="nav"><button class="active" data-page="home"><span class="ico">▦</span> الرئيسية</button><button data-page="facilities"><span class="ico">⌂</span> المنشآت</button><button data-page="visits"><span class="ico">✓</span> الزيارات</button><button data-page="violations"><span class="ico">⚑</span> المخالفات</button><button data-page="samples"><span class="ico">♧</span> العينات</button><button data-page="schedule"><span class="ico">▣</span> المواعيد</button><button data-page="reports"><span class="ico">▤</span> التقارير</button><button data-page="backup"><span class="ico">⇅</span> النسخ الاحتياطي</button></nav><div class="side-note">الإصدار التجريبي المحلي<br>تُحفظ البيانات على هذا الجهاز فقط.<br>لا توجد مزامنة سحابية مفعّلة.</div></aside><main class="main"><header class="top"><div><h1 id="topTitle">لوحة التحكم</h1><p id="today"></p></div><span class="badge">● وضع العمل دون إنترنت</span></header><section class="content" id="content"></section></main></div><div class="toast" id="toast"></div><div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">إضافة سجل</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='foodInspectorPro_v1';
let db=loadDB(), page='home', editId=null;
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{facilities:[],visits:[],violations:[],samples:[],tasks:[]}}catch(e){return {facilities:[],visits:[],violations:[],samples:[],tasks:[]}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));}
function uid(prefix){return prefix+'-'+Date.now().toString().slice(-7)+'-'+Math.random().toString(36).slice(2,5).toUpperCase()}
function today(){return new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}
document.getElementById('today').textContent=today()+' · نسخة أولية للاستخدام الفردي';
const titles={home:'لوحة التحكم',facilities:'المنشآت الغذائية',visits:'سجل الزيارات',violations:'سجل المخالفات',samples:'إدارة العينات',schedule:'المواعيد والمتابعة',reports:'التقارير',backup:'النسخ الاحتياطي'};
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=titles[p];render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function countDue(){return db.tasks.filter(x=>x.status!=='تمت'&&x.date&&x.date<new Date().toISOString().slice(0,10)).length}
function render(){const el=document.getElementById('content');if(page==='home')el.innerHTML=home();else if(['facilities','visits','violations','samples','schedule'].includes(page))el.innerHTML=listPage(page);else if(page==='reports')el.innerHTML=reportsPage();else el.innerHTML=backupPage();}
function home(){return `<div class="welcome"><div><h2>أهلًا بك في Food Inspector Pro</h2><p>سجّل جولاتك الميدانية وتابع المنشآت والعينات والملاحظات من مكان واحد.<br>البيانات التي تضيفها تُحفظ محليًا على هذا الجهاز.</p></div><div class="welcome-icon">🛡️</div></div><div class="stats">${stat('المنشآت المسجلة',db.facilities.length,'ملفات المنشآت')}${stat('الزيارات المسجلة',db.visits.length,'جميع الزيارات')}${stat('المخالفات المسجلة',db.violations.length,'سجلات المخالفات')}${stat('العينات المسجلة',db.samples.length,'متابعة العينات')}${stat('مهام المتابعة',db.tasks.filter(t=>t.status!=='تمت').length,'لم تُغلق بعد')}${stat('مهام متأخرة',countDue(),'تحتاج إلى مراجعة')}${stat('عينات قيد المتابعة',db.samples.filter(s=>!['ظهرت النتيجة','أغلقت المتابعة'].includes(s.status)).length,'لم تُغلق بعد')}${stat('زيارات هذا الشهر',db.visits.filter(v=>(v.date||'').slice(0,7)===new Date().toISOString().slice(0,7)).length,'حسب تاريخ الجهاز')}</div><div class="grid2"><div class="panel"><h3>إجراءات سريعة</h3><div class="quick"><button onclick="openForm('facilities')"><span>＋</span>تسجيل منشأة</button><button onclick="openForm('visits')"><span>✓</span>تسجيل زيارة</button><button onclick="openForm('violations')"><span>⚑</span>تسجيل مخالفة</button><button onclick="openForm('samples')"><span>♧</span>تسجيل عينة</button><button onclick="go('schedule');openForm('schedule')"><span>▣</span>إضافة موعد</button><button onclick="go('reports')"><span>▤</span>إنشاء تقرير</button></div></div><div class="panel"><h3>أحدث السجلات</h3>${recentRows()}</div></div><p class="notice">تنبيه: هذه نسخة أولية محلية. لا تُعد نماذجها القانونية مستندات رسمية معتمدة، ويجب مراجعة الوقائع والإجراءات وفق تعليمات جهة العمل.</p>`}
function stat(label,num,foot){return `<div class="stat"><div class="label">${label}</div><div class="num">${num}</div><div class="foot">${foot}</div></div>`}
function recentRows(){let all=[...db.visits.map(x=>({...x,_type:'زيارة',_name:facilityName(x.facilityId)})),...db.violations.map(x=>({...x,_type:'مخالفة',_name:facilityName(x.facilityId)})),...db.samples.map(x=>({...x,_type:'عينة',_name:x.product||x.kind||'عينة'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return all.length?all.map(x=>`<div class="rowitem"><span><b>${esc(x._type)}</b> · ${esc(x._name)}</span><span class="pill">${esc(x.date||'—')}</span></div>`).join(''):'<div class="empty">لا توجد سجلات حتى الآن. ابدأ بإضافة منشأة جديدة.</div>'}
const configs={facilities:{singular:'منشأة',id:'facilityId',fields:[['name','اسم المنشأة','text',true],['owner','اسم المالك أو المسؤول','text'],['phone','رقم الهاتف','tel'],['governorate','المحافظة','text'],['district','المركز / المدينة','text'],['area','القرية / الحي','text'],['address','العنوان التفصيلي','text',true],['activity','نوع النشاط','select',['مطعم','بقالة / سوبر ماركت','مخبز','جزارة','دواجن','مصنع أغذية','مخزن أغذية','ألبان','أخرى']],['status','حالة المنشأة','select',['قائمة','تحتاج متابعة','مغلقة مؤقتًا','غير محددة']],['notes','ملاحظات','textarea']]},visits:{singular:'زيارة',fields:[['facilityId','المنشأة','facility',true],['date','تاريخ الزيارة','date',true],['inspector','اسم المفتش','text'],['kind','نوع الزيارة','select',['دورية','متابعة','شكوى','إعادة تفتيش','أخرى']],['cleanliness','النظافة العامة','select',['مطابق','غير مطابق','لم يُقيّم']],['handling','تداول الأغذية','select',['مطابق','غير مطابق','لم يُقيّم']],['storage','التخزين والتبريد','select',['مطابق','غير مطابق','لم يُقيّم']],['temperature','درجة الحرارة / الوحدة','text'],['expiry','حالة الصلاحية','select',['مطابق','غير مطابق','لم يُقيّم']],['workers','الشهادات الصحية للعاملين','select',['مطابق','غير مطابق','لا ينطبق','لم يُقيّم']],['pests','مكافحة الحشرات والقوارض','select',['مطابق','غير مطابق','لم يُقيّم']],['observations','الملاحظات','textarea'],['actions','الإجراءات المتخذة','textarea'],['followDate','موعد إعادة التفتيش','date'],['status','حالة الزيارة','select',['مسودة','مكتملة','تحتاج متابعة']]]},violations:{singular:'مخالفة',fields:[['facilityId','المنشأة','facility',true],['date','تاريخ اكتشافها','date',true],['description','وصف المخالفة','textarea',true],['category','التصنيف','select',['نظافة','تخزين','صلاحية أغذية','تداول أغذية','شهادات صحية','أخرى']],['severity','درجة الخطورة (تقدير مبدئي)','select',['تحتاج تقييم','منخفضة','متوسطة','مرتفعة']],['action','الإجراء المتخذ','text'],['reportNo','رقم المحضر إن وجد','text'],['status','حالة المتابعة','select',['جديدة','قيد المتابعة','تمت الإحالة','أغلقت']]]},samples:{singular:'عينة',fields:[['facilityId','المنشأة','facility',true],['date','تاريخ السحب','date',true],['kind','نوع العينة','text',true],['product','اسم المنتج','text'],['manufacturer','الشركة المصنعة','text'],['batch','رقم التشغيلة','text'],['expiry','تاريخ الصلاحية','date'],['reason','سبب السحب','text'],['lab','المعمل المستلم','text'],['sentDate','تاريخ الإرسال','date'],['resultDate','تاريخ ظهور النتيجة','date'],['result','نتيجة التحليل حسب التقرير','textarea'],['status','حالة العينة','select',['تم تسجيلها','تم سحبها','تم إرسالها للمعمل','قيد التحليل','ظهرت النتيجة','تحتاج إلى إجراء','أغلقت المتابعة']]]},schedule:{singular:'موعد',fields:[['title','عنوان المهمة / المنشأة','text',true],['date','التاريخ','date',true],['reason','سبب الزيارة أو المتابعة','text'],['priority','الأولوية','select',['عادية','مهمة','عاجلة']],['address','العنوان','text'],['status','حالة المهمة','select',['مجدولة','تمت','مؤجلة']],['notes','ملاحظات','textarea']]}};
function facilityName(id){return db.facilities.find(x=>x.id===id)?.name||'منشأة غير محددة'}
function listPage(p){let c=configs[p],items=db[p]||[];return `<div class="pagehead"><div><h2>${titles[p]}</h2><p>إضافة السجلات وتعديلها والبحث فيها محليًا.</p></div><button onclick="openForm('${p}')">＋ إضافة ${c.singular}</button></div><div class="tools"><input id="searchBox" placeholder="ابحث في السجلات..." oninput="filterTable('${p}')"><button class="secondary" onclick="clearSearch()">مسح البحث</button></div><div class="tablewrap"><table><thead><tr>${tableHeaders(p)}<th>إجراءات</th></tr></thead><tbody id="tableBody">${tableRows(p,items)}</tbody></table></div><p class="notice">عدد السجلات: ${items.length}. الحذف يزيل السجل من التخزين المحلي لهذا الجهاز؛ صدّر نسخة احتياطية دوريًا.</p>`}
function tableHeaders(p){let f=configs[p].fields;let keys=p==='facilities'?['name','activity','address','phone','status']:p==='visits'?['facilityId','date','kind','status','followDate']:p==='violations'?['facilityId','date','description','severity','status']:p==='samples'?['facilityId','kind','date','status','resultDate']:['title','date','priority','status','address'];return keys.map(k=>`<th>${esc(fieldLabel(p,k))}</th>`).join('')}
function fieldLabel(p,k){return configs[p].fields.find(f=>f[0]===k)?.[1]||k}
function cell(p,x,k){let v=x[k]??'';if(k==='facilityId')v=facilityName(v);return esc(v||'—')}
function tableRows(p,items){let keys=p==='facilities'?['name','activity','address','phone','status']:p==='visits'?['facilityId','date','kind','status','followDate']:p==='violations'?['facilityId','date','description','severity','status']:p==='samples'?['facilityId','kind','date','status','resultDate']:['title','date','priority','status','address'];if(!items.length)return `<tr><td colspan="${keys.length+1}"><div class="empty">لا توجد بيانات بعد.</div></td></tr>`;return items.map(x=>`<tr data-search="${esc(JSON.stringify(x)+' '+(x.facilityId?facilityName(x.facilityId):'' )).toLowerCase()}">${keys.map(k=>`<td>${cell(p,x,k)}</td>`).join('')}<td><div class="actions"><button class="secondary" onclick="openForm('${p}','${x.id}')">تعديل</button><button class="danger" onclick="delRecord('${p}','${x.id}')">حذف</button></div></td></tr>`).join('')}
function filterTable(p){let q=document.getElementById('searchBox').value.toLowerCase();document.querySelectorAll('#tableBody tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')};function clearSearch(){document.getElementById('searchBox').value='';filterTable(page)}
function openForm(p,id=null){if(p==='schedule'&&page!=='schedule')go('schedule');editId=id;const c=configs[p],old=id?(db[p]||[]).find(x=>x.id===id)||{}:{};document.getElementById('modalTitle').textContent=(id?'تعديل ':'إضافة ')+c.singular;document.getElementById('modalBody').innerHTML=`<form id="recordForm" onsubmit="saveRecord(event,'${p}')"><div class="formgrid">${c.fields.map(f=>fieldHtml(f,old[f[0]],p)).join('')}</div><div class="formactions"><button type="submit">حفظ البيانات</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`;document.getElementById('modalback').style.display='flex'}
function fieldHtml(f,val,p){let [k,label,type,required]=f;val=val||'';let req=required?'required':'';let control='';if(type==='select'){control=`<select name="${k}" ${req}><option value="">اختر...</option>${f[3].map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else if(type==='facility'){control=`<select name="${k}" ${req}><option value="">اختر المنشأة...</option>${db.facilities.map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`}else if(type==='textarea'){control=`<textarea name="${k}" ${req}>${esc(val)}</textarea>`}else{control=`<input name="${k}" type="${type}" value="${esc(val)}" ${req}>`}return `<label class="${type==='textarea'?'wide':''}">${label}${control}</label>`}
function saveRecord(e,p){e.preventDefault();let form=new FormData(e.target),obj={};for(let [k,v] of form.entries())obj[k]=v.trim();if(!obj.id)obj.id=editId||uid(p.slice(0,3).toUpperCase());obj.updatedAt=new Date().toISOString();let arr=db[p];let i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]={...arr[i],...obj};else{obj.createdAt=new Date().toISOString();arr.unshift(obj)}persist();closeModal();render();toast('تم حفظ البيانات على هذا الجهاز بنجاح');}
function delRecord(p,id){if(!confirm('هل تريد حذف هذا السجل؟ لا يمكن التراجع إلا باستعادة نسخة احتياطية.'))return;db[p]=db[p].filter(x=>x.id!==id);persist();render();toast('تم حذف السجل')}
function closeModal(){document.getElementById('modalback').style.display='none'}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function reportsPage(){return `<div class="pagehead"><div><h2>التقارير</h2><p>أنشئ ملخصًا قابلًا للطباعة أو احفظه بصيغة PDF من نافذة الطباعة.</p></div><button onclick="makeReport()">إنشاء تقرير الآن</button></div><div class="panel"><div class="formgrid"><label>نوع التقرير<select id="reportType"><option value="all">ملخص شامل</option><option value="facilities">المنشآت</option><option value="visits">الزيارات</option><option value="violations">المخالفات</option><option value="samples">العينات</option><option value="schedule">المواعيد والمتابعة</option></select></label><label>من تاريخ<input type="date" id="fromDate"></label><label>إلى تاريخ<input type="date" id="toDate"></label></div><div class="formactions"><button onclick="makeReport()">عرض التقرير</button><button class="secondary" onclick="window.print()">طباعة / حفظ PDF</button></div><div id="reportOutput" class="reportbox">حدد نوع التقرير ثم اضغط «عرض التقرير».</div></div><p class="notice">قد تختلف جودة عرض العربية حسب إعدادات الطباعة. التقرير أداة مساعدة وليس نموذجًا رسميًا معتمدًا.</p>`}
function makeReport(){let typ=document.getElementById('reportType').value,from=document.getElementById('fromDate').value,to=document.getElementById('toDate').value;let names={facilities:'المنشآت',visits:'الزيارات',violations:'المخالفات',samples:'العينات',schedule:'المواعيد'};let keys=typ==='all'?Object.keys(names):[typ];let out=`تقرير مفتش الأغذية الذكي\nتاريخ الإنشاء: ${today()}\nالفترة: ${from||'بداية السجلات'} — ${to||'حتى الآن'}\n${'='.repeat(35)}\n`;keys.forEach(k=>{let rows=db[k]||[];rows=rows.filter(x=>{let d=x.date||'';return (!from||d>=from)&&(!to||d<=to)});out+=`\n${names[k]} (${rows.length})\n`;if(!rows.length)out+='لا توجد سجلات في الفترة المحددة.\n';rows.forEach((x,i)=>{let name=x.name||x.title||x.product||x.kind||x.description||'سجل';out+=`${i+1}. ${name} | التاريخ: ${x.date||'—'} | الحالة: ${x.status||'—'}${x.facilityId?' | المنشأة: '+facilityName(x.facilityId):''}\n`})});document.getElementById('reportOutput').textContent=out}
function backupPage(){return `<div class="pagehead"><div><h2>النسخ الاحتياطي والاستعادة</h2><p>احتفظ بنسخة من بياناتك لنقلها أو استعادتها عند الحاجة.</p></div></div><div class="grid2"><div class="panel"><h3>تصدير نسخة احتياطية</h3><p class="notice">سيتم تنزيل ملف JSON يحتوي على السجلات المسجلة في هذا التطبيق.</p><button onclick="exportBackup()">⇩ تنزيل النسخة الاحتياطية</button></div><div class="panel"><h3>استعادة نسخة احتياطية</h3><p class="notice">تنبيه: الاستعادة تستبدل البيانات الحالية بالبيانات الموجودة في الملف.</p><input id="backupFile" type="file" accept="application/json,.json"><div class="formactions"><button class="secondary" onclick="importBackup()">استعادة البيانات</button></div></div></div><div class="panel" style="margin-top:16px"><h3>حالة التخزين</h3><div class="rowitem"><span>مكان التخزين</span><b>المتصفح على هذا الجهاز</b></div><div class="rowitem"><span>عدد المنشآت</span><b>${db.facilities.length}</b></div><div class="rowitem"><span>عدد الزيارات</span><b>${db.visits.length}</b></div><div class="rowitem"><span>عدد المخالفات</span><b>${db.violations.length}</b></div><div class="rowitem"><span>عدد العينات</span><b>${db.samples.length}</b></div></div><p class="notice">النسخة الحالية لا تُزامن البيانات تلقائيًا مع السحابة، ولا توفر تشفيرًا مخصصًا لقاعدة البيانات. لا تستخدمها وحدها لحفظ بيانات حساسة قبل اعتماد ضوابط أمنية مناسبة.</p>`}
function exportBackup(){let blob=new Blob([JSON.stringify({app:'Food Inspector Pro',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='food-inspector-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
function importBackup(){let f=document.getElementById('backupFile').files[0];if(!f){toast('اختر ملف النسخة الاحتياطية أولًا');return}if(!confirm('سيتم استبدال كل البيانات الحالية. هل تريد المتابعة؟'))return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result),d=parsed.data||parsed;if(!d.facilities||!d.visits||!d.violations||!d.samples)throw Error();db={facilities:d.facilities,visits:d.visits,violations:d.violations,samples:d.samples,tasks:d.tasks||[]};persist();render();toast('تمت استعادة البيانات بنجاح')}catch(e){alert('الملف غير صالح أو لا يحتوي على بيانات التطبيق المطلوبة.')}};r.readAsText(f)}
function seedDemo(){if(db.facilities.length||db.visits.length)return;db.facilities=[{id:'FAC-DEMO-01',name:'منشأة تجريبية — مطعم النخيل',owner:'بيانات تجريبية',phone:'',governorate:'البحيرة',district:'أبو المطامير',area:'مثال تجريبي',address:'عنوان تجريبي غير حقيقي',activity:'مطعم',status:'تحتاج متابعة',notes:'سجل تجريبي — لا يمثل منشأة حقيقية'}];db.visits=[{id:'VIS-DEMO-01',facilityId:'FAC-DEMO-01',date:new Date().toISOString().slice(0,10),kind:'دورية',cleanliness:'لم يُقيّم',handling:'لم يُقيّم',storage:'لم يُقيّم',status:'مسودة',observations:'زيارة تجريبية فقط — استبدل هذه البيانات ببياناتك الفعلية.'}];persist()}
// The first launch starts clean; no fake records are silently inserted.
render();
</script></body></html>
